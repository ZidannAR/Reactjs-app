<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knew you would say yes!</title>
    <link rel="stylesheet" href="./yes_style.css">
</head>
<body>
    <div class="container">
        <h3 class="header_text">horeeeee ayoo kita dc ruy</h3>
        <div class="gif_container">
            <img id="playButton" src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmo3c3l5ODh3ZGN6NHhhaDE2Mjg1ZjkwOXczdDFxbWM3dTBtaW9zaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/9XY4f3FgFTT4QlaYqa/giphy.gif">
        </div>
    </div>

    <audio id="musik" src="Kuru Kuru Kururin - Raphiiel.mp3" loop></audio>

    <script>
        const musik = document.getElementById("musik");
        const playButton = document.getElementById("playButton");

        // Ketika gambar diklik, musik akan mulai diputar
        playButton.addEventListener("click", () => {
            musik.muted = false;
            musik.play()
                .then(() => console.log("Musik diputar"))
                .catch(error => console.log("Autoplay gagal:", error));

            // Simpan status agar musik tetap diputar setelah reload
            localStorage.setItem("musicAllowed", "true");
        });

        // Jika sebelumnya musik sudah diizinkan, putar otomatis saat reload
        window.onload = () => {
            if (localStorage.getItem("musicAllowed")) {
                musik.muted = false;
                musik.play()
                    .then(() => console.log("Musik diputar setelah reload"))
                    .catch(error => console.log("Autoplay gagal:", error));
            }
        };
    </script>
</body>
</html>
